logLevel: debug
host: "0.0.0.0"
port: 8080

healthCheckTimeout: 1000
globalTTL: 1800

matrix:
  vars:
    generic: "lovedheart/Qwen3.5-9B-FP8"
    coder: "Qwen/Qwen3.8-27B-FP8"
    nomic: "nomic-ai/nomic-embed-text-v1.5"

  evict_costs:
    generic: 10
    coder: 30
    nomic: 1

  sets:
    coder_suite: "generic & coder & nomic"

hooks:
  on_startup:
    preload: ["nomic-ai/nomic-embed-text-v1.5", "Qwen/Qwen3.8-27B-FP8"]

models:
  "lovedheart/Qwen3.5-9B-FP8":
    checkEndpoint: /v1/models
    cmd: >
      docker run --rm --runtime=nvidia
      --gpus '"device=${env.LLM_DEVICE_ID_0}"'
      -e HF_TOKEN=${env.HF_TOKEN}
      --network llm-network
      --name vllm-${PORT}
      -v ${env.HF_HOME}:/root/.cache/huggingface
      vllm/vllm-openai:latest
        --model lovedheart/Qwen3.5-9B-FP8
        --port ${PORT}
        --host 0.0.0.0
        --gpu-memory-utilization 0.95
        --enable-prefix-caching
        --max-model-len 248320
        --kv-cache-dtype auto
        --attention-backend flashinfer
        --mamba-cache-mode align
        --mamba-block-size 8

    cmdStop: "docker stop vllm-${PORT} || true"
    proxy: http://vllm-${PORT}:${PORT}
    type: proxy

  "Qwen/Qwen3.6-35B-A3B-FP8":
    checkEndpoint: /v1/models
    cmd: >
      docker run --rm --runtime=nvidia
      --gpus '"device=${env.LLM_DEVICE_ID_1},${env.LLM_DEVICE_ID_2}"'
      -e PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
      -e HF_TOKEN=${env.HF_TOKEN}
      --network llm-network
      --name vllm-${PORT}
      -v ${env.HF_HOME}:/root/.cache/huggingface
      vllm/vllm-openai:latest
      --model Qwen/Qwen3.6-35B-A3B-FP8
      --host 0.0.0.0
      --port ${PORT}
      --tensor-parallel-size 2
      --enable-chunked-prefill
      --max-model-len 262144
      --gpu-memory-utilization 0.90
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --enable-prefix-caching
      --max-num-seqs 1
      --max-num-batched-tokens 16384
      --disable-custom-all-reduce
    cmdStop: "docker stop vllm-${PORT} || true"
    proxy: http://vllm-${PORT}:${PORT}
    type: proxy

  # A/B stress control: --max-num-seqs 1 is deliberate (single-request scheduling);
  # do not "fix" it. concurrencyLimit is a harness property and must stay equal to
  # Qwen/Qwen3.8-27B-FP8-batch.
  "Qwen/Qwen3.8-27B-FP8":
    checkEndpoint: /v1/models
    concurrencyLimit: 64
    cmd: >
      docker run --rm --runtime=nvidia
      --gpus '"device=${env.LLM_DEVICE_ID_1},${env.LLM_DEVICE_ID_2}"'
      -e HF_TOKEN=${env.HF_TOKEN}
      --network llm-network
      --name vllm-${PORT}
      -v ${env.HF_HOME}:/root/.cache/huggingface
      vllm/vllm-openai:latest
      --model Qwen/Qwen3.8-27B-FP8
      --host 0.0.0.0
      --port ${PORT}
      --tensor-parallel-size 2
      --max-model-len 262144
      --gpu-memory-utilization 0.90
      --kv-cache-dtype fp8
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --enable-prefix-caching
      --max-num-seqs 1
      --max-num-batched-tokens 16384
    cmdStop: "docker stop vllm-${PORT} || true"
    proxy: http://vllm-${PORT}:${PORT}
    type: proxy

  # Stress-only A/B variant of the block above: same weights, --max-num-seqs 64.
  # Deliberately absent from preload and from the matrix — that omission keeps it
  # from coexisting with the baseline. --served-model-name bridges the gateway id
  # to the weights path. Not a production model.
  "Qwen/Qwen3.8-27B-FP8-batch":
    checkEndpoint: /v1/models
    concurrencyLimit: 64
    cmd: >
      docker run --rm --runtime=nvidia
      --gpus '"device=${env.LLM_DEVICE_ID_1},${env.LLM_DEVICE_ID_2}"'
      -e HF_TOKEN=${env.HF_TOKEN}
      --network llm-network
      --name vllm-${PORT}
      -v ${env.HF_HOME}:/root/.cache/huggingface
      vllm/vllm-openai:latest
      --model Qwen/Qwen3.8-27B-FP8
      --served-model-name Qwen/Qwen3.8-27B-FP8-batch
      --host 0.0.0.0
      --port ${PORT}
      --tensor-parallel-size 2
      --max-model-len 262144
      --gpu-memory-utilization 0.90
      --kv-cache-dtype fp8
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --enable-prefix-caching
      --max-num-seqs 64
      --max-num-batched-tokens 16384
    cmdStop: "docker stop vllm-${PORT} || true"
    proxy: http://vllm-${PORT}:${PORT}
    type: proxy

  "nomic-ai/nomic-embed-text-v1.5":
    checkEndpoint: /v1/models
    cmd: >
      docker run --rm --runtime=nvidia
      --gpus "device=${env.INDEXER_STORAGE_DEVICE_ID}"
      -e HF_TOKEN=${env.HF_TOKEN}
      --network llm-network
      --name vllm-${PORT}
      -v ${env.HF_HOME}:/root/.cache/huggingface
      vllm/vllm-openai:latest
      --model nomic-ai/nomic-embed-text-v1.5
      --host 0.0.0.0
      --port ${PORT}
      --max-model-len 2048
      --gpu-memory-utilization 0.25
      --trust-remote-code
    cmdStop: "docker stop vllm-${PORT} || true"
    proxy: http://vllm-${PORT}:${PORT}
    type: proxy
